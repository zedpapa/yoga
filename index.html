<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Wellness Library</h1>
        <div id="profile-area">
            <span id="welcome-message"></span>
            <input type="text" id="username-input" placeholder="Enter username">
            <button id="profile-btn">Load/Switch Profile</button>
        </div>
        <nav id="discipline-nav">
            <!-- Discipline tabs will be generated by JS -->
        </nav>
    </header>

    <div class="app-container">
        <aside id="sidebar">
            <div id="sidebar-content">
                <h2>Filter by Label</h2>
                <div id="tradition-filters">
                    <!-- Filter labels will be generated here -->
                </div>
            </div>
        </aside>

        <main>
            <section id="flow-container">
                <h2>Practice Flows</h2>
                <div id="flow-display">
                    <h3>Your Saved Flows</h3>
                </div>
                <div id="flow-creator">
                    <h3>Create a New Flow</h3>
                    <form id="new-flow-form">
                        <div class="form-group">
                            <label for="flow-name">Flow Name:</label>
                            <input type="text" id="flow-name" required>
                        </div>
                        <div class="form-group">
                            <label for="flow-description">Description:</label>
                            <textarea id="flow-description" rows="3"></textarea>
                        </div>
                        <button type="submit">Create Flow</button>
                    </form>
                </div>
            </section>
            <section id="card-grid-container">
                <div class="grid-header">
                    <h2>Library</h2>
                </div>
                <div id="card-grid">
                    <!-- Cards will be displayed here -->
                </div>
            </section>
            <section id="card-creator-container">
                <h2>Create a New Card</h2>
                <form id="new-card-form">
                    <div class="form-group">
                        <label for="asana-name">Name:</label>
                        <input type="text" id="asana-name" required>
                    </div>
                    <div class="form-group">
                        <label for="asana-photo">Photo:</label>
                        <input type="file" id="asana-photo" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="body-parts">Body Parts Targeted:</label>
                        <input type="text" id="body-parts">
                    </div>
                    <div class="form-group">
                        <label for="connected-organs">Connected Organs:</label>
                        <input type="text" id="connected-organs">
                    </div>
                    <div class="form-group">
                        <label for="traditions-select">Label / Category:</label>
                        <select id="traditions-select"></select>
                    </div>
                    <button type="submit">Create Card</button>
                </form>
            </section>
        </main>
    </div>

    <div id="edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Edit Card</h2>
            <form id="edit-card-form">
                <input type="hidden" id="edit-card-id">
                <div class="form-group">
                    <label for="edit-asana-name">Name:</label>
                    <input type="text" id="edit-asana-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-asana-photo">New Photo (optional):</label>
                    <input type="file" id="edit-asana-photo" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="edit-body-parts">Body Parts Targeted:</label>
                    <input type="text" id="edit-body-parts">
                </div>
                <div class="form-group">
                    <label for="edit-connected-organs">Connected Organs:</label>
                    <input type="text" id="edit-connected-organs">
                </div>
                <div class="form-group">
                    <label for="edit-traditions-select">Label / Category:</label>
                    <select id="edit-traditions-select"></select>
                </div>
                <div class="form-actions">
                    <button type="submit">Save Changes</button>
                    <button type="button" id="cancel-edit-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="initial-data.js"></script>
    <script src="data-strength.js"></script>
    <script src="data-pilates.js"></script>
    <script src="data-tai-chi.js"></script>
    <script src="data-nei-kung.js"></script>
    <script src="data-calisthenics.js"></script>
    <script src="data-mobility.js"></script>
    <script src="data-plyometrics.js"></script>
    <script src="data-rehab.js"></script>
    <script src="script.js"></script>
</body>
</html>
